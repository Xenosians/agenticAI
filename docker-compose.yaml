# Development directory lab (Samba AD domain controller) for the directory tools.
# Its own project name: without one Compose derives "itsm-agent" from the folder,
# which another checkout on this machine also resolves to, and bringing that stack
# up replaced this lab. The volumes keep their original names because they hold
# the provisioned domain, its users and the TLS CA in .runtime/trust.
name: itsm-directory-lab

services:
  samba-ad:
    build:
      context: ./docker/samba-ad

    container_name: itsm-samba-ad
    hostname: itsmdc

    privileged: true

    environment:
      SAMBA_DOMAIN: ${SAMBA_DOMAIN:-ITSM}
      SAMBA_REALM: ${SAMBA_REALM:-itsm.local}
      SAMBA_NETBIOS: ${SAMBA_NETBIOS:-ITSMDC}
      SAMBA_ADMIN_PASS: ${SAMBA_ADMIN_PASS:?SAMBA_ADMIN_PASS must be set}

    ports:
      - "1389:389"
      - "1636:636"

    volumes:
      - samba_etc:/etc/samba
      - samba_lib:/var/lib/samba
      - samba_cache:/var/cache/samba

    restart: unless-stopped


volumes:
  samba_etc:
    name: itsm-agent_samba_etc
  samba_lib:
    name: itsm-agent_samba_lib
  samba_cache:
    name: itsm-agent_samba_cache
