# Local-only lab. No public SMTP listener, remote target, relay or DNS delivery.
# Plaintext authentication is confined to loopback-published Docker ports.
$(primary_domain) = {env:MADDY_DOMAIN}
hostname mx.$(primary_domain)
tls off
auth.pass_table local_authdb {
    table sql_table {
        driver sqlite3
        dsn credentials.db
        table_name passwords
    }
}
storage.imapsql local_mailboxes {
    driver sqlite3
    dsn imapsql.db
}
submission tcp://0.0.0.0:587 {
    auth &local_authdb
    insecure_auth yes
    io_debug no
    source $(primary_domain) {
        check {
            authorize_sender {
                user_to_email identity
            }
        }
        destination $(primary_domain) {
            deliver_to &local_mailboxes
        }
        default_destination {
            reject 550 5.7.1 "The local lab cannot relay public email"
        }
    }
    default_source {
        reject 550 5.7.1 "Only lab senders are allowed"
    }
}
imap tcp://0.0.0.0:143 {
    auth &local_authdb
    storage &local_mailboxes
    insecure_auth yes
    io_debug no
}
