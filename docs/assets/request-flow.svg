<text class="note note-browser" x="480.0" y="210" text-anchor="middle">1. You ask in chat; the browser keeps no secrets or tokens.</text>
<text class="note note-phoenix" x="480.0" y="210" text-anchor="middle">2. Phoenix checks your session and CSRF, saves a durable job.</text>
<text class="note note-gateway" x="480.0" y="210" text-anchor="middle">3. Every model call, network link and tool call crosses Lua first.</text>
<text class="note note-router" x="480.0" y="210" text-anchor="middle">4. The hub names the specialist and the values you gave.</text>
<text class="note note-specialist" x="480.0" y="210" text-anchor="middle">5. A specialist proposes one tool call: a proposal, never authority.</text>
<text class="note note-guard" x="480.0" y="210" text-anchor="middle">6. Trusted code checks the call against policy and your exact words.</text>
<text class="note note-approval" x="480.0" y="210" text-anchor="middle">7. Anything that changes data waits for your approval of exact values.</text>
<text class="note note-tool" x="480.0" y="210" text-anchor="middle">8. The tool runs once against the real system and reads the result back.</text>
<text class="note note-result" x="480.0" y="210" text-anchor="middle">9. Phoenix records the verified outcome; unknown stays unknown.</text>
<text class="note note-answer" x="480.0" y="210" text-anchor="middle">10. You see the answer and the evidence behind it, in your chat.</text>
