<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="flow-title flow-desc">
<title id="flow-title">How one request travels through Janus</title>
<desc id="flow-desc">1. Browser: You ask in chat; the browser keeps no secrets or tokens. 2. Phoenix: Phoenix checks your session and CSRF, saves a durable job. 3. Lua gateway: Every model call, network link and tool call crosses Lua first. 4. Hub routing: The hub names the specialist and the values you gave. 5. Specialist: A specialist proposes one tool call: a proposal, never authority. 6. Trusted guard: Trusted code checks the call against policy and your exact words. 7. Approval: Anything that changes data waits for your approval of exact values. 8. MCP tool: The tool runs once against the real system and reads the result back. 9. Result: Phoenix records the verified outcome; unknown stays unknown. 10. Answer: You see the answer and the evidence behind it, in your chat.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e6e"/></marker>
</defs>
<style>text { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #f2f2f2; }
.title { font-size: 15px; font-weight: 600; }
.subtitle { font-size: 12px; fill: #b0b0b0; }
.note { font-size: 15px; opacity: 0; }
.edge { stroke: #6e6e6e; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
.box { fill: #0b0b0b; stroke: #6e6e6e; stroke-width: 1.5; }
.lit { fill: none; stroke: #f2f2f2; stroke-width: 2.5; opacity: 0; }
.token { fill: #f2f2f2; }
@keyframes lit-browser { 0.00% { opacity: 0; } 0.00% { opacity: 1; } 9.50% { opacity: 1; } 10.00% { opacity: 0; } 100.00% { opacity: 0; } }
.lit-browser { animation: lit-browser 18.0s linear infinite; }
.note-browser { animation: lit-browser 18.0s linear infinite; }
@keyframes lit-phoenix { 0.00% { opacity: 0; } 9.99% { opacity: 0; } 10.00% { opacity: 1; } 19.50% { opacity: 1; } 20.00% { opacity: 0; } 100.00% { opacity: 0; } }
.lit-phoenix { animation: lit-phoenix 18.0s linear infinite; }
.note-phoenix { animation: lit-phoenix 18.0s linear infinite; }
@keyframes lit-gateway { 0.00% { opacity: 0; } 19.99% { opacity: 0; } 20.00% { opacity: 1; } 29.50% { opacity: 1; } 30.00% { opacity: 0; } 100.00% { opacity: 0; } }
.lit-gateway { animation: lit-gateway 18.0s linear infinite; }
.note-gateway { animation: lit-gateway 18.0s linear infinite; }
@keyframes lit-router { 0.00% { opacity: 0; } 29.99% { opacity: 0; } 30.00% { opacity: 1; } 39.50% { opacity: 1; } 40.00% { opacity: 0; } 100.00% { opacity: 0; } }
.lit-router { animation: lit-router 18.0s linear infinite; }
.note-router { animation: lit-router 18.0s linear infinite; }
@keyframes lit-specialist { 0.00% { opacity: 0; } 39.99% { opacity: 0; } 40.00% { opacity: 1; } 49.50% { opacity: 1; } 50.00% { opacity: 0; } 100.00% { opacity: 0; } }
.lit-specialist { animation: lit-specialist 18.0s linear infinite; }
.note-specialist { animation: lit-specialist 18.0s linear infinite; }
@keyframes lit-guard { 0.00% { opacity: 0; } 49.99% { opacity: 0; } 50.00% { opacity: 1; } 59.50% { opacity: 1; } 60.00% { opacity: 0; } 100.00% { opacity: 0; } }
.lit-guard { animation: lit-guard 18.0s linear infinite; }
.note-guard { animation: lit-guard 18.0s linear infinite; }
@keyframes lit-approval { 0.00% { opacity: 0; } 59.99% { opacity: 0; } 60.00% { opacity: 1; } 69.50% { opacity: 1; } 70.00% { opacity: 0; } 100.00% { opacity: 0; } }
.lit-approval { animation: lit-approval 18.0s linear infinite; }
.note-approval { animation: lit-approval 18.0s linear infinite; }
@keyframes lit-tool { 0.00% { opacity: 0; } 69.99% { opacity: 0; } 70.00% { opacity: 1; } 79.50% { opacity: 1; } 80.00% { opacity: 0; } 100.00% { opacity: 0; } }
.lit-tool { animation: lit-tool 18.0s linear infinite; }
.note-tool { animation: lit-tool 18.0s linear infinite; }
@keyframes lit-result { 0.00% { opacity: 0; } 79.99% { opacity: 0; } 80.00% { opacity: 1; } 89.50% { opacity: 1; } 90.00% { opacity: 0; } 100.00% { opacity: 0; } }
.lit-result { animation: lit-result 18.0s linear infinite; }
.note-result { animation: lit-result 18.0s linear infinite; }
@keyframes lit-answer { 0.00% { opacity: 0; } 89.99% { opacity: 0; } 90.00% { opacity: 1; } 99.50% { opacity: 1; } 100.00% { opacity: 0; } 100.00% { opacity: 0; } }
.lit-answer { animation: lit-answer 18.0s linear infinite; }
.note-answer { animation: lit-answer 18.0s linear infinite; }</style>
