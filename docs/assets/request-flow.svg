<g><rect class="box" x="780" y="70" width="150" height="64" rx="10"/><rect class="lit lit-specialist" x="777" y="67" width="156" height="70" rx="12"/><text class="title" x="855.0" y="98" text-anchor="middle">Specialist</text><text class="subtitle" x="855.0" y="117" text-anchor="middle">one proposal</text></g>
<g><rect class="box" x="780" y="280" width="150" height="64" rx="10"/><rect class="lit lit-guard" x="777" y="277" width="156" height="70" rx="12"/><text class="title" x="855.0" y="308" text-anchor="middle">Trusted guard</text><text class="subtitle" x="855.0" y="327" text-anchor="middle">policy, grounding</text></g>
<g><rect class="box" x="595" y="280" width="150" height="64" rx="10"/><rect class="lit lit-approval" x="592" y="277" width="156" height="70" rx="12"/><text class="title" x="670.0" y="308" text-anchor="middle">Approval</text><text class="subtitle" x="670.0" y="327" text-anchor="middle">you decide</text></g>
