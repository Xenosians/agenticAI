<g><rect class="box" x="225" y="280" width="150" height="64" rx="10"/><rect class="lit lit-result" x="222" y="277" width="156" height="70" rx="12"/><text class="title" x="300.0" y="308" text-anchor="middle">Result</text><text class="subtitle" x="300.0" y="327" text-anchor="middle">verified outcome</text></g>
