<g><rect class="box" x="40" y="70" width="150" height="64" rx="10"/><rect class="lit lit-browser" x="37" y="67" width="156" height="70" rx="12"/><text class="title" x="115.0" y="98" text-anchor="middle">Browser</text><text class="subtitle" x="115.0" y="117" text-anchor="middle">Nim / Karax</text></g>
<g><rect class="box" x="225" y="70" width="150" height="64" rx="10"/><rect class="lit lit-phoenix" x="222" y="67" width="156" height="70" rx="12"/><text class="title" x="300.0" y="98" text-anchor="middle">Phoenix</text><text class="subtitle" x="300.0" y="117" text-anchor="middle">sessions, jobs</text></g>
<g><rect class="box" x="410" y="70" width="150" height="64" rx="10"/><rect class="lit lit-gateway" x="407" y="67" width="156" height="70" rx="12"/><text class="title" x="485.0" y="98" text-anchor="middle">Lua gateway</text><text class="subtitle" x="485.0" y="117" text-anchor="middle">every outbound link</text></g>
